<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product List</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/productlist.css" />
  </head>
  <body>
    <main class="page">
      <!-- Top -->
      <header class="topbar">
        <div class="logo">Fashion<span class="r">R</span>Us</div>
        <nav class="nav">
          <a href="index.html">Categories</a>
          <a href="#">Brands</a>
          <a href="#">Seasons</a>
        </nav>
      </header>

      <!-- Titel opdateres af JS -->
      <h1 class="page-title" id="list-title">Products</h1>

      <!-- Produkt-grid -->
      <section
        id="product-list"
        class="product_list_container"
        aria-label="Produktliste"
      ></section>

      <!-- Skabelon for kort -->
      <template id="card-tpl">
        <article class="product-card">
          <a class="card-link" href="#">
            <div class="thumb">
              <img class="thumb-img" src="" alt="" loading="lazy" />
              <span class="soldout-flag" hidden>Sold Out</span>
            </div>

            <h3 class="name"></h3>
            <p class="meta"></p>

            <div class="price-row" data-price>
              <div class="prices">
                <div class="prev"></div>
                <div class="now"></div>
              </div>
              <span class="discount-badge" hidden></span>
            </div>

            <span class="readmore">Read More</span>
          </a>
        </article>
      </template>

      <p id="error" style="display: none; color: #c00; font-weight: 700">
        Kunne ikke hente produkter. Prøv at opdatere siden.
      </p>
    </main>

    <script src="js/list.js" defer></script>
  </body>
</html>
